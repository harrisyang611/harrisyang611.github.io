<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume — Harris Yang</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #152238;
            --secondary: #4a4a4a;
            --accent: #d97706;
            --bg: #fafaf9;
            --surface: #ffffff;
            --border: #e5e5e5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Work Sans', sans-serif;
            background: var(--bg);
            color: var(--primary);
            line-height: 1.6;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        /* Header */
        header {
            padding: 2rem 0;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.95);
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-decoration: none;
            color: var(--primary);
        }

        nav ul {
            display: flex;
            gap: 2.5rem;
            list-style: none;
        }

        nav a {
            text-decoration: none;
            color: var(--secondary);
            font-size: 0.95rem;
            font-weight: 400;
            transition: color 0.3s ease;
            position: relative;
        }

        nav a:hover,
        nav a.active {
            color: var(--primary);
        }

        nav a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--accent);
            transition: width 0.3s ease;
        }

        nav a:hover::after,
        nav a.active::after {
            width: 100%;
        }

        /* Resume page body */
        .resume-section {
            padding: 4rem 0;
            flex: 1;
        }

        .resume-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
        }

        .resume-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: -0.5px;
        }

        .btn {
            padding: 1rem 2rem;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 500;
            transition: all 0.3s ease;
            display: inline-block;
            font-size: 0.95rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(217, 119, 6, 0.2);
        }

        .resume-frame {
            width: 100%;
            height: 85vh;
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        .mobile-resume-note {
            display: none;
            color: var(--secondary);
            font-size: 1rem;
            margin-top: 1rem;
        }

        /* Footer */
        footer {
            padding: 3rem 0;
            border-top: 1px solid var(--border);
            text-align: center;
            color: var(--secondary);
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .resume-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }

            .resume-frame {
                display: none;
            }

            .mobile-resume-note {
                display: block;
            }

            nav ul {
                gap: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav class="container">
            <a href="index.html" class="logo">Harris Yang</a>
            <ul>
                <li><a href="index.html#about">About</a></li>
                <li><a href="index.html#projects">Projects</a></li>
                <li><a href="index.html#contact">Contact</a></li>
                <li><a href="resume.html" class="active">Resume</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="resume-section">
            <div class="container">
                <div class="resume-header">
                    <h1 class="resume-title">Resume</h1>
                    <a href="resume/resume_260330.pdf" download="Harris_Yang_Resume.pdf" rel="noopener noreferrer" class="btn btn-primary">Download Resume</a>
                </div>
                <iframe
                    src="resume/resume_260330.pdf"
                    class="resume-frame"
                    title="Harris Yang Resume">
                    <p>Your browser cannot display this PDF. <a href="resume/resume_260330.pdf">Download it directly</a>.</p>
                </iframe>
                <p class="mobile-resume-note">Use the button above to download the resume.</p>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Harris Yang. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
